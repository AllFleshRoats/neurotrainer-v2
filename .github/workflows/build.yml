name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install --upgrade cython
        pip install buildozer
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
[app]

title = NeuroTrainer
package.name = neurotrainer
package.domain = org.example.neurotrainer

source.dir = .
source.include_exts = py,png,jpg,kv,atlas,txt,json

version = 0.1

requirements = python3==3.11.11,kivy==2.3.0

orientation = portrait
fullscreen = 0

android.permissions = WRITE_EXTERNAL_STORAGE
android.api = 33
android.minapi = 21
android.ndk = 25c
android.sdk = 33

[buildozer]
log_level = 2
warn_on_root = 1
EOF
    
    - name: Build with buildozer
      run: buildozer -v android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: neurotrainer-apk
        path: bin/*.apk

                    - name: APK action
  # You may pin to the exact commit or the version.
  # uses: WaterLemons2k/apk-action@6872ea1c0a08c2646b5a9cfd7d5262659050c0ff
  uses: WaterLemons2k/apk-action@v1.1.2
  with:
    # Contents of the keystore file (.jks), base64 encoded
    keystore: 
    # Password of the keystore
    keystore-password: 
    # Alias of the key
    key-alias: 
    # Password of the key
    key-password: 
    # The Java version to set up
    java-version: # optional
    # The arguments passed to Gradle
    gradle-args: # optional, default is --no-daemon
    # Build a release or debug APK
    release: # optional, default is true
          
