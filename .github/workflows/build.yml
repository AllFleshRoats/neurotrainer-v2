name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout код
      uses: actions/checkout@v4

    - name: Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Установка системных зависимостей
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Установка buildozer и зависимостей
      run: |
        pip install --upgrade pip
        pip install --upgrade cython
        pip install buildozer

    - name: Создание buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
[app]

title = NeuroTrainer
package.name = neurotrainer
package.domain = org.example.neurotrainer

source.dir = .
source.include_exts = py,png,jpg,kv,atlas,txt,json

version = 0.1

requirements = python3==3.11.11,kivy==2.3.0

orientation = portrait
fullscreen = 0

android.permissions = WRITE_EXTERNAL_STORAGE
android.api = 33
android.minapi = 21
android.ndk = 25b
android.sdk = 33

[buildozer]
log_level = 2
warn_on_root = 1
EOF

    - name: Запуск сборки APK
      run: buildozer -v android debug

    - name: Загрузка готового APK
      uses: actions/upload-artifact@v4
      with:
        name: neurotrainer-apk
        path: bin/*.apk
