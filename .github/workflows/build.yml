name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk wget
        pip install cython buildozer
    - name: Setup Android SDK manually
      run: |
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip commandlinetools-linux-9477386_latest.zip -d cmdline-tools
        mkdir -p android-sdk/cmdline-tools
        mv cmdline-tools cmdline-tools/latest
        mv cmdline-tools android-sdk/
        export ANDROID_SDK_ROOT=$PWD/android-sdk
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --licenses
        sdkmanager "build-tools;30.0.3" "platform-tools" "platforms;android-30"
    - name: Create config
      run: |
        echo "[app]" > buildozer.spec
        echo "title = NeuroTrainer" >> buildozer.spec
        echo "package.name = neurotrainer" >> buildozer.spec
        echo "package.domain = org.example.neurotrainer" >> buildozer.spec
        echo "source.dir = ." >> buildozer.spec
        echo "source.include_exts = py,png,jpg,kv,atlas,txt,json" >> buildozer.spec
        echo "version = 0.1" >> buildozer.spec
        echo "requirements = python3,kivy" >> buildozer.spec
        echo "orientation = portrait" >> buildozer.spec
        echo "fullscreen = 0" >> buildozer.spec
        echo "android.permissions = WRITE_EXTERNAL_STORAGE" >> buildozer.spec
        echo "android.api = 30" >> buildozer.spec
        echo "android.minapi = 21" >> buildozer.spec
        echo "android.ndk = 25c" >> buildozer.spec
        echo "android.sdk = 30" >> buildozer.spec
        echo "android.accept_sdk_license = True" >> buildozer.spec
        echo "[buildozer]" >> buildozer.spec
        echo "log_level = 2" >> buildozer.spec
    - name: Build
      run: buildozer -v android debug
      env:
        ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: neurotrainer-apk
        path: bin/*.apk
